[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "narrative-designer-research"
version = "0.1.0"
description = "Reusable multi-agent historical research engine for narrative design — grid proposer, source scout, harvesting pipeline, director knowledge API"
authors = [{ name = "Orlando Guerrero", email = "oguerrerofarias@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["historical-research", "narrative-design", "llm", "multi-agent", "digital-humanities", "cybersyn"]

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "structlog>=24.1",
    "python-dotenv>=1.0",

    # Archive ingestion
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "pypdf>=4.2",
    "requests>=2.32",

    # Canonicalization & NER
    "pandas>=2.2",
    "duckdb>=1.0",
    "dateparser>=1.2",

    # Runtime / API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",

    # Research Engine — Gatekeeper
    "diskcache>=5.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
indexer = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]
finetune = [
    "torch>=2.3",
    "transformers>=4.42",
    "peft>=0.11",
    "bitsandbytes>=0.43",
    "accelerate>=0.31",
    "datasets>=2.20",
    "wandb>=0.17",
]
nlp = [
    "spacy>=3.7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
gatekeeper   = "research_engine.gatekeeper.app:main"
admin        = "admin.app:main"
propositor   = "research_engine.propositor:main"
archivero    = "pipeline.archivero:main"
verificator  = "pipeline.verificator:main"
mapper       = "pipeline.mapper:main"
cast-manager = "pipeline.cast_manager:main"
grid-proposer = "research_engine.grid_proposer:main"
source-scout  = "research_engine.source_scout:main"
location-manager = "pipeline.location_manager:main"
cast-director = "pipeline.cast_director:main"
doc-curator  = "pipeline.doc_curator:main"
pipeline-run = "lib.run_tracker:main"

[tool.hatch.build.targets.wheel]
packages = ["lib", "pipeline", "runtime", "analysis", "finetune", "research_engine", "admin"]

# ---- Ruff ----
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

# ---- Pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

# ---- Mypy ----
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
