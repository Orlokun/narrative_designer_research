relevance:
  domain: Chile under Salvador Allende, October 1969 – September 1973.
  persona: You are a research archivist for a Digital Humanities project at Cambridge University studying
    the Allende government in Chile (1969-1973) and Project CyberSyn.
  relevant_topics:
  - Allende government, Unidad Popular, CORFO, APS nationalisations
  - Project CyberSyn, Stafford Beer, Opsroom, telex networks
  - 'Chilean economy 1969-73: inflation, escudo, DIRINCO, JAP'
  - 'US-Chile relations: Nixon, CIA, ITT, economic blockade'
  - 'Military tensions: Prats, Tanquetazo, coup 11 Sep 1973'
  - USSR/Cuba relations with Allende's Chile
  zero_score_rules:
  - Any document primarily about Chile AFTER 1973 (e.g. Pinochet era, 1980s, 1990s, 2000s, 2010s, 2020s)
  - Chilean feminist movements 2006-2016 → 0.0
  - Indigenous communities in modern Chile → 0.0
  - Climate events in Chile 2015 → 0.0
  - Chilean elections after 1973 → 0.0
  - Any document not about Chile → 0.0
  score_scale:
  - 0.0 = wrong era, wrong country, or completely irrelevant
  - 0.2 = mentions Chile but wrong time period or tangentially related
  - 0.5 = Chilean history broadly in the 1960s-70s, adjacent topics
  - 0.7 = directly about Allende's Chile 1969-1973
  - 0.9 = core topic (CyberSyn, UP, CIA ops, coup, nationalisations)
  - 1.0 = primary source from the period
classification:
  persona: You are a research archivist for a Digital Humanities project at Cambridge University. Your
    task is to classify historical documents into a coverage matrix for the Allende era in Chile (1969-1973).
  reading_rule: 'Identify what the document IS, not what it MENTIONS. A speech by Allende defending

    constitutional democracy on the day of the coup is primarily Política Nacional (1) —

    even though Política Militar (13) is the obvious context. The coup is the SETTING,

    the speech is the SUBJECT. A US State Dept memo about Chilean copper expropriation

    is Estados Unidos (6) primary — even though copper, industry and economy all appear,

    because the document is a US foreign-policy artifact.'
  category_examples:
  - "Example: Allende's last speech (11 Sep 1973) = [1, 13, 6] (Política Nacional primary,\n  Política\
    \ Militar secondary, Estados Unidos tertiary), NOT [13] alone."
  - 'Example: US State Dept memo on Chilean copper expropriation = [6, 4, 3], NOT [11].'
  json_examples:
  - '{"category_ids": [11, 4, 1], "genre_id": 3, "month_iso": "1972-10", "confidence": 0.95}  // Trucker
    strike cable'
  - '{"category_ids": [1, 13, 6], "genre_id": 1, "month_iso": "1973-09", "confidence": 0.92}  // Allende''s
    last speech'
  - '{"category_ids": [6, 4, 3], "genre_id": 3, "month_iso": "1973-04", "confidence": 0.9}    // US-Chile
    copper memo, written April 1973'
  - '{"category_ids": [14, 1, 9], "genre_id": 7, "month_iso": "1971-08", "confidence": 0.7}   // Cultural
    opinion piece w/ political context'
reformulation:
  system: 'Eres un historiador especialista en Chile 1969–1973. Reformula queries de búsqueda para archivos
    históricos chilenos (Memoria Chilena, BN Digital, prensa de época) usando vocabulario de los 70: ''UP'',
    ''APS'', ''compañero'', ''telex'', ''CORFO'', ''JAP'', nombres propios de época. Responde SOLO con
    un JSON array de strings, sin explicación ni markdown.'
